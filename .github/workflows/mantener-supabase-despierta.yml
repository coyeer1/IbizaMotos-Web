# Mantiene despierta la base de datos de Supabase.
#
# ¿Por qué? El plan gratis de Supabase PAUSA el proyecto tras ~7 días de poca
# actividad. Cuando eso pasa se cae la parte dinámica del sitio: el formulario
# de opiniones del QR deja de guardar y las citas (cuando se activen) fallan.
# Este ping diario cuenta como actividad → el proyecto nunca se pausa.
# Alternativa de pago que esto evita: Supabase Pro (~USD 25/mes).
#
# Las llaves salen de los Secrets del repo (Settings → Secrets → Actions):
#   SUPABASE_URL       → https://<ref>.supabase.co
#   SUPABASE_ANON_KEY  → llave anon (es pública por diseño, la protege RLS)

name: Mantener Supabase despierta

on:
  schedule:
    # 13:20 UTC = 8:20 a.m. en Colombia, todos los días.
    - cron: '20 13 * * *'
  workflow_dispatch: # permite correrlo a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Faltan los secrets SUPABASE_URL / SUPABASE_ANON_KEY en el repo."
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/blog_metrics?select=post_id&limit=1")
          echo "Respuesta de Supabase: HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::La base de datos no respondió 200 (HTTP $code). Puede estar pausada: revisa el panel de Supabase."
            exit 1
          fi
          echo "OK — la base de datos está despierta."
