<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 180" fill="none">
  <!-- Official Vento logo: checkmark/V arrow shape -->
  <g transform="translate(5, 10)">
    <!-- Red arrow/checkmark pointing right shape -->
    <!-- Large V / arrow emblem -->
    <polygon points="0,20 55,20 90,90 125,20 180,20 110,160 70,160" fill="#CC0000"/>
    <!-- White inner V -->
    <polygon points="22,30 55,30 90,100 125,30 158,30 110,145 70,145" fill="white"/>
    <!-- Red inner fill to create outline effect -->
    <polygon points="40,35 57,35 90,108 123,35 140,35 110,138 70,138" fill="#CC0000"/>
  </g>
  <!-- VENTO wordmark -->
  <text x="200" y="118" 
        font-family="'Arial Black', Arial, sans-serif" 
        font-weight="900" 
        font-size="68" 
        fill="#CC0000"
        letter-spacing="3">VENTO</text>
</svg>
